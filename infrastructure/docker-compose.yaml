services:
  db:
    image: mysql:latest
    restart: always
    env_file:
      - .env.dev
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    expose:
      - "3306"
    volumes:
      - ${VOLUME_PATH}:/var/lib/mysql
